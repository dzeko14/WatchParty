services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: watchparty
      POSTGRES_PASSWORD: watchparty
      POSTGRES_DB: watchparty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchparty -d watchparty"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data: